[project]
name = "workout-plan-generator"
version = "0.1.0"
description = "CLI workout plan generator with Groq strict structured outputs"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.9,<3", "groq>=0.30,<1", "python-dotenv>=1,<2", "streamlit>=1.40,<2"]

[project.scripts]
workout-generator = "workout_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9", "pyright>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/workout_generator"]
